services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: dancingponysvc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dancingpony
    volumes:
      - postgres_data_2:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dancingponysvc -d dancingpony"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orc-shack-api
    environment:
      DATABASE_URL: postgresql+psycopg://dancingponysvc:password@postgres:5432/dancingpony
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-secure-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-orc-shack-api}
      JWT_TOKEN_VERSION: ${JWT_TOKEN_VERSION:-1}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data_2:
  prometheus_data:
